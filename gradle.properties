android.enableR8.fullMode=false
android.enableJetifier=true
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m
android.defaults.buildfeatures.buildconfig=true

# compileSdk 37 is newer than the Android Gradle plugin this project pins.
# Silence the "we recommend a newer Android Gradle plugin" warning so the
# build still succeeds on API 37.
android.suppressUnsupportedCompileSdk=37
